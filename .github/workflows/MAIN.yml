name: generate animation

on:
  # প্রতি ১২ ঘণ্টা পর পর অটোমেটিক রান হবে
  schedule:
    - cron: "0 */12 * * *"
  
  # Actions ট্যাব থেকে ম্যানুয়ালি রান করার জন্য
  workflow_dispatch:
  
  # main ব্রাঞ্চে কোড পুশ করলেও রান হবে
  push:
    branches:
    - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # Snake animation জেনারেট করার স্টেপ
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # জেনারেট হওয়া ফাইলগুলো output ব্রাঞ্চে পুশ করার স্টেপ
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
